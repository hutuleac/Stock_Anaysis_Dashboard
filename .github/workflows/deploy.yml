name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Aimed at ~10:00 ET and ~16:30 ET on weekdays (an EDT and an EST cron per
    # slot — cron is UTC). GitHub has been starting these 3–6 h late, so the gate
    # classifies each run by when it actually starts, not by which cron fired.
    - cron: '0 14 * * 1-5'
    - cron: '0 15 * * 1-5'
    - cron: '30 20 * * 1-5'
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - id: mode
        run: |
          # push → republish the live snapshot; manual run → fresh close snapshot
          if [ "${{ github.event_name }}" = push ]; then mode=reuse
          elif [ "${{ github.event_name }}" != schedule ]; then mode=close
          else
            # New York time-of-day buckets, not narrow windows: a window skipped
            # every run from Oct 19 to Nov 7 2026 while reporting green.
            t=$((10#$(TZ=America/New_York date +%H%M)))
            if   [ "$(TZ=America/New_York date +%u)" -ge 6 ]; then mode=skip
            elif [ $t -ge 1625 ]; then mode=close   # a second close run the same day reuses (snapshot.mjs)
            elif [ $t -ge 930 ];  then mode=open    # intraday: quotes/F&G/BTC refresh, candles reuse
            else mode=skip; fi                     # pre-open: last evening's close is still current
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "snapshot mode: $mode"

  build-and-deploy:
    needs: gate
    if: needs.gate.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    # queue rather than cancel, so a push never kills a snapshot run mid-fetch
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: node scripts/fetch-macro.mjs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: node scripts/snapshot.mjs
        env:
          SNAPSHOT_MODE: ${{ needs.gate.outputs.mode }}
          LIVE_URL: https://hutuleac.github.io/Stock_Anaysis_Dashboard/snapshot.json
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      - run: npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
