name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 22 * * *' # daily, after the US close: fresh candles.json + macro.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: node scripts/fetch-macro.mjs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: node scripts/fetch-candles.mjs
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          # push deploys reuse the live snapshot; the nightly run always refetches
          REUSE_URL: ${{ github.event_name != 'schedule' && 'https://hutuleac.github.io/Stock_Anaysis_Dashboard/candles.json' || '' }}
      - run: npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
